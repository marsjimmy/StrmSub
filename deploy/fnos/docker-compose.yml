# StrmSub v2 on 飞牛 fnOS
# 部署目录: /vol1/1000/docker/strmsub
# 启动: cd /vol1/1000/docker/strmsub && docker compose up -d
# 仪表盘: http://<飞牛IP>:8099
# v2 变化: 不再对接飞牛影视 API, 按文件名正则识别标题;
#   字幕源开关/凭证/正则规则/令牌全部在设置页里配, 存 SQLite。
#   首次启动可用下面的环境变量播种, 之后以数据库为准。
services:
  strmsub:
    image: marsjimmyliu/strmsub:v2.0.3
    container_name: strmsub
    restart: unless-stopped
    ports:
      - "8099:8099"
    environment:
      TZ: Asia/Shanghai
      STRMSUB_ADDR: ":8099"
      STRMSUB_DATA_DIR: /app/data
      # 媒体目录: 扫描 + 字幕落盘都需要写权限 (别加 :ro)
      STRMSUB_MEDIA_DIRS: /media
      STRMSUB_SCAN_INTERVAL: 30m
      STRMSUB_TARGET_LANG: zh-Hans
      # 字幕统一保存目录 (留空=视频同目录)
      STRMSUB_SUB_DIR: ${SUB_DIR:-}
      # 扫描后自动下载缺失的中文字幕 (默认 true)
      STRMSUB_AUTO_DOWNLOAD: ${AUTO_DOWNLOAD:-true}
      # FlareSolverr (可选, 用于过 Cloudflare 反爬)
      STRMSUB_FLARESOLVERR_URL: ${FLARESOLVERR_URL:-}
      # 字幕源 token (首次启动播种用; 之后在设置页改)
      # 去 https://assrt.net/usercp.php 免费拿
      STRMSUB_ASSRT_TOKEN: ${ASSRT_TOKEN:-}
      STRMSUB_OS_API_KEY: ${OS_API_KEY:-}
      STRMSUB_OS_USER: ${OS_USER:-}
      STRMSUB_OS_PASS: ${OS_PASS:-}
      STRMSUB_SUBDL_KEY: ${SUBDL_KEY:-}
    volumes:
      # 媒体目录
      - /vol1/1000/smartstrm:/media
      # 数据目录: SQLite 数据库 (设置/索引/缓存/历史/令牌全在里面)
      - /vol1/1000/docker/strmsub/data:/app/data
      # 字幕统一目录 (可选, 不用就注释掉; 用了的话 STRMSUB_SUB_DIR=/subs)
      # - /vol1/1000/docker/strmsub/subs:/subs
    # 镜像默认以 root 运行, 保证能读写媒体目录和数据目录。
    # 如需以普通用户运行, 取消下面注释并把 uid 换成你的用户,
    # 同时 chown -R <uid> /vol1/1000/docker/strmsub/data /vol1/1000/smartstrm
    # user: "1026"
