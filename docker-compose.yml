# StrmSub v2 本地开发用 compose（发布用 deploy/fnos/docker-compose.yml）
services:
  strmsub:
    image: marsjimmyliu/strmsub:v2.0.2
    container_name: strmsub
    restart: unless-stopped
    ports:
      - "8099:8099"
    environment:
      TZ: Asia/Shanghai
      STRMSUB_ADDR: ":8099"
      STRMSUB_DATA_DIR: /app/data
      # 媒体目录：扫描 + 字幕落盘需要读写权限
      STRMSUB_MEDIA_DIRS: /media
      STRMSUB_SCAN_INTERVAL: 30m
      STRMSUB_TARGET_LANG: zh-Hans
      STRMSUB_SUB_DIR: ${SUB_DIR:-}
      STRMSUB_FLARESOLVERR_URL: ${FLARESOLVERR_URL:-}
      STRMSUB_ASSRT_TOKEN: ${ASSRT_TOKEN:-}
      STRMSUB_OS_API_KEY: ${OS_API_KEY:-}
      STRMSUB_OS_USER: ${OS_USER:-}
      STRMSUB_OS_PASS: ${OS_PASS:-}
      STRMSUB_SUBDL_KEY: ${SUBDL_KEY:-}
    volumes:
      - /vol1/1000/media:/media
      - ./data:/app/data
